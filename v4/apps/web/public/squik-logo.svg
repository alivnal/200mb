<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <!-- Wordmark: SQUIK — bold geometric letters -->

  <!-- S -->
  <path d="M8 14h24a6 6 0 0 1 6 6v8a6 6 0 0 1-6 6H14a4 4 0 0 0-4 4v8a4 4 0 0 0 4 4h24" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Q (circle + tail) -->
  <circle cx="68" cy="32" r="18" stroke="currentColor" stroke-width="7" fill="none"/>
  <line x1="80" y1="44" x2="90" y2="54" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>

  <!-- U -->
  <path d="M106 14v28a10 10 0 0 0 20 0V14" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- I -->
  <line x1="148" y1="14" x2="148" y2="50" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
  <line x1="140" y1="14" x2="156" y2="14" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
  <line x1="140" y1="50" x2="156" y2="50" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>

  <!-- K -->
  <line x1="170" y1="14" x2="170" y2="50" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
  <path d="M170 32 L192 14" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M170 32 L192 50" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lightning bolt accent (replaces dot above I visually, sits after K) -->
  <path d="M210 10 L202 32 L208 32 L200 54 L214 28 L208 28 Z" fill="#0e71fb"/>
</svg>
